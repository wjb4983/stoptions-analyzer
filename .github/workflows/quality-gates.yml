name: quality-gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  smoke-suite:
    name: Fast smoke suite
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run smoke-marked tests
        run: |
          pytest -m smoke -ra -q 2>&1 | tee pytest-smoke-summary.txt
      - name: Upload smoke pytest summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-smoke-summary
          path: pytest-smoke-summary.txt

  core-correctness:
    name: Core correctness suite
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run baseline benchmark artifact generation
        run: python reports/run_baselines.py
      - name: Run benchmark scorecard gate
        run: python reports/benchmark_bundle.py
      - name: Calibration checks
        run: python reports/calibrate_slippage_snapshots.py --fills reports/historical_fills.json
      - name: Evaluate aggregate merge/deploy quality gates
        run: python reports/quality_gates.py
      - name: Generate model and strategy cards
        run: python reports/generate_cards.py
      - name: Validate governance artifacts
        run: python reports/validate_governance_artifacts.py
      - name: Run core-marked tests
        run: |
          pytest -m core -ra -q 2>&1 | tee pytest-core-summary.txt
      - name: Upload core pytest summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-core-summary
          path: pytest-core-summary.txt
      - name: Upload governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-artifacts
          path: |
            reports/quality_gates_report.json
            reports/model_card.json
            reports/strategy_card.json
            reports/benchmark_scorecard.json
            reports/calibration_report.json
            reports/baseline_metrics_summary.json
            reports/baseline_metrics_summary.csv
            reports/pass_fail_checklist.md

  full-regression:
    name: Full regression suite
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run baseline benchmark artifact generation
        run: python reports/run_baselines.py
      - name: Run benchmark scorecard gate
        run: python reports/benchmark_bundle.py
      - name: Calibration checks
        run: python reports/calibrate_slippage_snapshots.py --fills reports/historical_fills.json
      - name: Evaluate aggregate merge/deploy quality gates
        run: python reports/quality_gates.py
      - name: Generate model and strategy cards
        run: python reports/generate_cards.py
      - name: Validate governance artifacts
        run: python reports/validate_governance_artifacts.py
      - name: Run full regression tests
        run: |
          pytest -ra -q 2>&1 | tee pytest-full-summary.txt
      - name: Upload full pytest summary on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-summary
          path: pytest-full-summary.txt

  deploy:
    runs-on: ubuntu-latest
    needs: [full-regression]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Quality gates must pass before deploy
        run: echo "Deploy unblocked: all required quality gates passed."
